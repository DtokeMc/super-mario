<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script type="text/javascript">
        window.EJS_player = '#game-container';
        window.EJS_core = 'nes';
        window.EJS_gameUrl = 'https://raw.githubusercontent.com/dtokemc/super-mario/main/roms/super-mario-bros.nes';
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/npm/emulatorjs@3.4.2/data/';
        window.EJS_color = '#000000';
        window.EJS_startOnLoaded = true;
        
        // Parámetros críticos para bloquear la aceleración de velocidad
        window.EJS_threads = false;
        window.EJS_fixedTimeStep = true;
        window.EJS_disableDatabases = true;
        window.EJS_volume = 1.0;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/emulatorjs@3.4.2/data/loader.js"></script>
</body>
</html>
