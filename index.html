
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'nes';
        EJS_defaultOptions = {
 'fceumm_region': 'NTSC'
};
        EJS_gameUrl = 'roms/super-mario-bros.nes';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_color = '#000000';
        EJS_startOnLoaded = true;
        EJS_defaultOptions = {
    'vsync': 'disabled'
};
        EJS_threads = false;
        EJS_disableDatabases = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
