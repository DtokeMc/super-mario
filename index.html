<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'nes';
        EJS_gameUrl = 'roms/super-mario-bros.nes';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_color = '#209cee';
        
        // Configuración para corregir la velocidad (Forzar 60 FPS estables)
        EJS_startOnLoaded = false; // Exigido por el navegador para activar el audio con el clic
        EJS_disableSpeedLimit = false;
        EJS_gameFrameRate = 60.0988; // Tasa de refresco exacta de la NES original
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
