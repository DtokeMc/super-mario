<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #emulator-wrap {
            width: 256px;
            height: 240px;
            transform: scale(3);
            transform-origin: center;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="emulator-wrap">
        <canvas id="nes-canvas" width="256" height="240"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/0.2.0/jsnes.min.js"></script>
    <script>
        var nes;
        window.onload = function() {
            nes = new jsnes.NES({
                onFrame: function(frameBuffer) {
                    var canvas = document.getElementById('nes-canvas');
                    var ctx = canvas.getContext('2d');
                    var imageData = ctx.createImageData(256, 240);
                    for (var i = 0; i < frameBuffer.length; i++) {
                        var pixel = frameBuffer[i];
                        imageData.data[i * 4] = (pixel & 0xFF0000) >> 16;
                        imageData.data[i * 4 + 1] = (pixel & 0x00FF00) >> 8;
                        imageData.data[i * 4 + 2] = (pixel & 0x0000FF);
                        imageData.data[i * 4 + 3] = 255;
                    }
                    ctx.putImageData(imageData, 0, 0);
                },
                onAudioSample: function(left, right) {}
            });

            var req = new XMLHttpRequest();
            req.open('GET', 'roms/super-mario-bros.nes', true);
            req.responseType = 'arraybuffer';
            req.onload = function() {
                var buffer = req.response;
                var byteArray = new Uint8Array(buffer);
                var romData = '';
                for (var i = 0; i < byteArray.byteLength; i++) {
                    romData += String.fromCharCode(byteArray[i]);
                }
                nes.loadROM(romData);
                
                // Bucle de temporización estricto a 60 FPS reales (evita el x2)
                setInterval(function() {
                    nes.frame();
                }, 1000 / 60);
            };
            req.send();
        };

        // Controles de teclado
        window.addEventListener('keydown', (event) => {
            if (!nes) return;
            if (event.key === 'ArrowUp') nes.buttonDown(1, jsnes.Controller.BUTTON_UP);
            if (event.key === 'ArrowDown') nes.buttonDown(1, jsnes.Controller.BUTTON_DOWN);
            if (event.key === 'ArrowLeft') nes.buttonDown(1, jsnes.Controller.BUTTON_LEFT);
            if (event.key === 'ArrowRight') nes.buttonDown(1, jsnes.Controller.BUTTON_RIGHT);
            if (event.key === 'z' || event.key === 'Z') nes.buttonDown(1, jsnes.Controller.BUTTON_A);
            if (event.key === 'x' || event.key === 'X') nes.buttonDown(1, jsnes.Controller.BUTTON_B);
            if (event.key === 'Enter') nes.buttonDown(1, jsnes.Controller.BUTTON_START);
            if (event.key === 'Shift') nes.buttonDown(1, jsnes.Controller.BUTTON_SELECT);
        });

            if
