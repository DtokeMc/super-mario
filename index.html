<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #nes-container {
            width: 512px;
            height: 480px;
        }
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="nes-container">
        <canvas id="nes-canvas" width="256" height="240"></canvas>
    </div>

    <!-- Librería estable de JSNES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/0.2.0/jsnes.min.js"></script>
    <script>
        const canvas = document.getElementById('nes-canvas');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(256, 240);

        const nes = new jsnes.NES({
            onFrame: function(frameBuffer) {
                for (let i = 0; i < frameBuffer.length; i++) {
                    let pixel = frameBuffer[i];
                    imageData.data[i * 4]     = (pixel & 0xFF0000) >> 16;
                    imageData.data[i * 4 + 1] = (pixel & 0x00FF00) >> 8;
                    imageData.data[i * 4 + 2] = (pixel & 0x0000FF);
                    imageData.data[i * 4 + 3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
            },
            onAudioSample: function(left, right) {}
        });

        // Usamos una ruta directa codificada o alternativa para evitar bloqueos de fetch local en GitHub Pages
        const romUrl = 'https://raw.githubusercontent.com/dtokemc/super-mario/main/roms/super-mario-bros.nes';

        fetch(romUrl)
            .then(res => {
                if (!res.ok) throw new Error("Error al descargar la ROM");
                return res.arrayBuffer();
            })
            .then(buffer => {
                const data = new Uint8Array(buffer);
                let rom = '';
                for (let i = 0; i < data.length; i++) {
                    rom += String.fromCharCode(data[i]);
                }
                nes.loadROM(rom);
