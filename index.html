<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Bros - Web Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        // Ruta exacta a tu archivo ROM en el repositorio
        EJS_player = '#game';
        EJS_core = 'nes';
        EJS_gameUrl = 'roms/super-mario-bros.nes'; // Asegúrate de que tu ROM esté en esta ruta
        
        // Ajustes de rendimiento, color y sonido
        EJS_startOnLoaded = false; // Muestra un botón de play para habilitar el sonido
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_color = '#e52521'; // Color temático de Nintendo
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
