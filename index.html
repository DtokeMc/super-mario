```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script type="text/javascript">
        // Configuración de EmulatorJS
        window.EJS_player = '#game';
        window.EJS_core = 'nes';
        window.EJS_gameUrl = 'roms/super-mario-bros.nes';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = false;
        window.EJS_color = '#209cee';

        // Evitar problemas relacionados con la ejecución en varios hilos
        window.EJS_threads = false;

        // Mantener la velocidad normal del emulador
        window.EJS_defaultOptions = {
            'vsync': 'enabled',
            'fps': '60'
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
