<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #emulator {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="emulator"></div>

    <script type="text/javascript">
        window.EJS_player = '#emulator';
        window.EJS_core = 'nes';
        // Usamos una ruta absoluta directa compatible con HTTPS estricto
        window.EJS_gameUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://raw.githubusercontent.com/dtokemc/super-mario/main/roms/super-mario-bros.nes');
        window.EJS_pathtodata = 'https://www.emulatorjs.com/stable/data/';
        window.EJS_color = '#000000';
        window.EJS_startOnLoaded = true;
        window.EJS_threads = false;
        window.EJS_fixedTimeStep = true;
    </script>
    <script src="https://www.emulatorjs.com/stable/data/loader.js"></script>
</body>
</html>
