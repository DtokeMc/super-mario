<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .frame-container {
            width: 100vw;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="frame-container">
        <!-- Contenedor optimizado con aislamiento de origen cruzado para bloquear la velocidad a 1x -->
        <iframe src="https://www.retrogames.cc/embed/41571-super-mario-bros-nes.html" 
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true" 
                scrolling="no" 
                allow="autoplay; fullscreen; gamepad; cross-origin-isolated"></iframe>
    </div>
</body>
</html>
