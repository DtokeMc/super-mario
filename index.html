<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script type="text/javascript">
        window.EJS_player = '#game';
        window.EJS_core = 'nes';
        // Usamos una URL directa y estable del CDN para evitar fallos de lectura local
        window.EJS_gameUrl = 'https://raw.githubusercontent.com/RetroAchievements/ROMSet/main/NES/Super%20Mario%20Bros.%20(World).nes';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_color = '#000000';
        window.EJS_startOnLoaded = true;
        
        // Bloqueos estrictos para evitar la velocidad x2
        window.EJS_threads = false;
        window.EJS_fixedTimeStep = true;
        window.EJS_disableDatabases = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
