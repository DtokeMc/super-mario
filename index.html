<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script type="text/javascript">
        // Forzar la configuración limpia de EmulatorJS evitando aceleraciones de hardware
        window.EJS_player = '#game';
        window.EJS_core = 'nes';
        window.EJS_gameUrl = 'roms/super-mario-bros.nes';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = false;
        window.EJS_color = '#209cee';
        
        // Truco crítico para evitar el x2 de velocidad en monitores de alta tasa de refresco:
        window.EJS_threads = false;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
