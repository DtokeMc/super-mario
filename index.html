<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
        }
        #nes-canvas {
            width: 512px;
            height: 480px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
        }
        #loading {
            position: absolute;
            font-size: 18px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="loading">Cargando Super Mario Bros...</div>
    <canvas id="nes-canvas" width="256" height="240"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/0.2.0/jsnes.min.js"></script>
    <script>
        const canvas = document.getElementById('nes-canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const imageData = ctx.createImageData(256, 240);

        const nes = new jsnes.NES({
            onFrame: function(frameBuffer) {
                for (let i = 0; i < frameBuffer.length; i++) {
                    let pixel = frameBuffer[i];
                    imageData.data[i * 4]     = (pixel & 0xFF0000) >> 16;
                    imageData.data[i * 4 + 1] = (pixel & 0x00FF00) >> 8;
